    <!-- Admin theme (Astryd): apply the saved Light/Dark/System choice before first paint. The admin app owns the
         storage key; the public site never reads it, and only sets the class when the admin shell is the page. -->
    <script>
      (function () {
        try {
          var p = location.pathname;
          var isPreview = new URLSearchParams(location.search).get('preview') === 'true';
          var platform = ['/', '/login', '/signup', '/super-admin', '/forgot-password', '/reset-password'];
          if (isPreview || !(p.indexOf('/admin') === 0 || platform.indexOf(p) !== -1)) return;
          var theme = localStorage.getItem('lumiere-admin-theme') || 'system';
          var resolved = theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {}
      })();
    </script>
